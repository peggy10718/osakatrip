                ],
                items: [
                    { time: "上午", type: "spot", title: "大鳥大社 (透明御守)", icon: "⛩️", mapQuery: "Otori Taisha", desc: "大國町(御堂筋線4mins)→天王寺(JR阪和線14mins)→鳳(走路7mins)。★購買御守、御朱印09:00才開始！最熱門：透明御守" },
                    { time: "上午", type: "spot", title: "阿倍野 HARUKAS 300 展望台", icon: "🏢", mapQuery: "Harukas 300 Observatory", desc: "鳳(JR阪和線14mins)→天王寺(走路3mins)。16樓售票處買票 柯南展！" },
                    { time: "午餐", type: "food", title: "近鐵百貨美食街", icon: "🍱", mapQuery: "Abeno Harukas Kintetsu Main Store", desc: "可直接在近鐵百貨美食街享用午餐" },
                    { time: "傍晚", type: "transport", title: "關西國際機場 (第一航廈)", icon: "✈️", mapQuery: "Kansai International Airport", desc: "搭車前往關西機場，辦理登機搭乘 20:55 亞航航班平安返台！" }
                ]
            }
        ];

        let currentTab = 0; // 0~5 代表行程, 'notes' 代表筆記, 'expense' 代表記帳

        // 讀取筆記與記帳數據
        let savedNotes = localStorage.getItem('osaka_notes') || '';
        let savedExpenses = JSON.parse(localStorage.getItem('osaka_expenses') || '[]');

        function renderTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = '';
            
            // 6天行程按鈕
            itineraryData.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all shadow-sm ${currentTab === index ? 'bg-white text-rose-600 shadow' : 'bg-white/15 text-white hover:bg-white/30'}`;
                btn.innerHTML = `Day ${index + 1} <span class="font-normal opacity-80 ml-1">${day.date.split(' ')[0]}</span>`;
                btn.onclick = () => switchTab(index);
                container.appendChild(btn);
            });

            // 筆記按鈕
            const notesBtn = document.createElement('button');
            notesBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all shadow-sm ${currentTab === 'notes' ? 'bg-white text-rose-600 shadow' : 'bg-white/15 text-white hover:bg-white/30'}`;
            notesBtn.innerHTML = `📝 行程筆記`;
            notesBtn.onclick = () => switchTab('notes');
            container.appendChild(notesBtn);

            // 記帳按鈕
            const expenseBtn = document.createElement('button');
            expenseBtn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all shadow-sm ${currentTab === 'expense' ? 'bg-white text-rose-600 shadow' : 'bg-white/15 text-white hover:bg-white/30'}`;
            expenseBtn.innerHTML = `💰 旅費記帳`;
            expenseBtn.onclick = () => switchTab('expense');
            container.appendChild(expenseBtn);
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            
            // 渲染筆記頁面
            if (currentTab === 'notes') {
                main.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xl">📝</span>
                            <h2 class="text-lg font-bold text-slate-900">隨手筆記 & 購物清單</h2>
                        </div>
                        <p class="text-xs text-slate-500 mb-4">內容會自動儲存在您的手機瀏覽器中，隨時紀錄購物清單或備忘事項！</p>
                        <textarea id="notes-input" oninput="saveNotes()" class="w-full h-80 p-3 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-500 focus:outline-none leading-relaxed" placeholder="在這裡輸入筆記、必買伴手禮清單、店家資訊...">${savedNotes}</textarea>
                    </div>
                `;
                updateNavButtons();
                return;
            }

            // 渲染記帳頁面
            if (currentTab === 'expense') {
                let totalJPY = 0;
                let totalTWD = 0;
                let boWeiTotal = 0;
                let peiWenTotal = 0;

                savedExpenses.forEach(exp => {
                    const amount = parseFloat(exp.amount) || 0;
                    if (exp.currency === 'JPY') {
                        totalJPY += amount;
                        if (exp.payer === '博威') boWeiTotal += amount * 0.21588;
                        if (exp.payer === '珮雯') peiWenTotal += amount * 0.21588;
                    } else {
                        totalTWD += amount;
                        if (exp.payer === '博威') boWeiTotal += amount;
                        if (exp.payer === '珮雯') peiWenTotal += amount;
                    }
                });

                let html = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-4">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xl">💰</span>
                            <h2 class="text-lg font-bold text-slate-900">旅費記帳本</h2>
                        </div>
                        <!-- 總計統計卡片 -->
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl text-center">
                                <span class="text-xs text-rose-600 block mb-0.5">日幣支出總計</span>
                                <span class="text-lg font-bold text-rose-700">￥${totalJPY.toLocaleString()}</span>
                            </div>
                            <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl text-center">
                                <span class="text-xs text-amber-600 block mb-0.5">台幣支出總計</span>
                                <span class="text-lg font-bold text-amber-700">NT$ ${totalTWD.toLocaleString()}</span>
                            </div>
                        </div>

                        <!-- 新增記帳表單 -->
                        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 mb-4 text-xs space-y-2">
                            <div class="font-bold text-slate-700">➕ 新增一筆消費</div>
                            <div class="grid grid-cols-2 gap-2">
                                <select id="exp-payer" class="p-2 rounded-lg border border-slate-200 bg-white">
                                    <option value="博威">付款人: 博威</option>
                                    <option value="珮雯">付款人: 珮雯</option>
                                    <option value="公費">付款人: 公費/共同</option>
                                </select>
                                <select id="exp-currency" class="p-2 rounded-lg border border-slate-200 bg-white">
                                    <option value="JPY">幣別: 日幣 (￥)</option>
                                    <option value="TWD">幣別: 台幣 (NT$)</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <input type="text" id="exp-item" placeholder="消費項目 (如: 串炸)" class="col-span-2 p-2 rounded-lg border border-slate-200 bg-white">
                                <input type="number" id="exp-amount" placeholder="金額" class="p-2 rounded-lg border border-slate-200 bg-white">
                            </div>
                            <button onclick="addExpense()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg transition">新增記錄</button>
                        </div>

                        <!-- 記帳列表 -->
                        <div class="space-y-2">
                            <div class="font-bold text-xs text-slate-700">消費明細列表</div>
                `;

                if (savedExpenses.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-4">目前還沒有記帳紀錄喔！</p>`;
                } else {
                    savedExpenses.forEach((exp, idx) => {
                        html += `
                            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs">
                                <div>
                                    <span class="font-bold text-slate-800">${exp.item}</span>
                                    <span class="text-[10px] text-slate-400 ml-1">(${exp.payer})</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-rose-600">${exp.currency === 'JPY' ? '￥' : 'NT$'} ${parseFloat(exp.amount).toLocaleString()}</span>
                                    <button onclick="deleteExpense(${idx})" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div></div>`;
                main.innerHTML = html;
                updateNavButtons();
                return;
            }

            // 渲染每日行程頁面
            const day = itineraryData[currentTab];
            let html = `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-4 animate-fade-in">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg font-bold">${day.badge}</span>
                        <span class="text-xs text-slate-400 font-medium">${day.date}</span>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900 mb-3">${day.title}</h2>
            `;

            if (day.tips && day.tips.length > 0) {
                html += `<div class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-xl mb-4 text-xs text-amber-900 space-y-1.5">
                    <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i>重要提示與快速購票</div>`;
                day.tips.forEach(tip => {
                    html += `<div>• ${tip}</div>`;
                });
                html += `</div>`;
            }

            html += `<div class="space-y-4 relative before:absolute before:left-3.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-100">`;

            day.items.forEach(item => {
                let badgeBg = 'bg-rose-50 border-rose-100';
                if(item.type === 'food') badgeBg = 'bg-amber-50 border-amber-100';
                if(item.type === 'transport') badgeBg = 'bg-blue-50 border-blue-100';
                if(item.type === 'shopping') badgeBg = 'bg-purple-50 border-purple-100';

                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery || item.title)}`;

                html += `
                    <div class="flex items-start gap-3 relative pl-0.5">
                        <!-- 將可愛 Emoji 直接放入時間軸圓圈圈中 -->
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0 z-10 shadow-xs border ${badgeBg}">
                            ${item.icon || '📍'}
                        </div>
                        <div class="bg-slate-50/80 hover:bg-slate-50 border border-slate-100 rounded-xl p-3.5 flex-1 transition">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-slate-500 bg-white px-2 py-0.5 rounded shadow-2xs">${item.time}</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-800 mb-1">
                                <a href="${mapUrl}" target="_blank" class="hover:text-rose-600 transition underline decoration-rose-300 flex items-center gap-1.5">
                                    <span>${item.title}</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-rose-500"></i>
                                </a>
                            </h3>
                            <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            main.innerHTML = html;
            updateNavButtons();
        }

        function updateNavButtons() {
            document.querySelectorAll('.nav-btn').forEach((btn) => {
                const idx = btn.getAttribute('data-index');
                if (idx == currentTab) {
                    btn.classList.add('text-rose-600');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-rose-600');
                    btn.classList.add('text-slate-500');
                }
            });
        }

        function switchTab(index) {
            currentTab = index;
            renderTabs();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 筆記儲存
        function saveNotes() {
            const val = document.getElementById('notes-input').value;
            savedNotes = val;
            localStorage.setItem('osaka_notes', val);
        }

        // 新增記帳
        function addExpense() {
            const payer = document.getElementById('exp-payer').value;
            const currency = document.getElementById('exp-currency').value;
            const item = document.getElementById('exp-item').value;
            const amount = document.getElementById('exp-amount').value;

            if (!item || !amount) {
                alert('請輸入消費項目與金額喔！');
                return;
            }

            savedExpenses.push({ payer, currency, item, amount });
            localStorage.setItem('osaka_expenses', JSON.stringify(savedExpenses));
            renderContent();
        }

        // 刪除記帳
        function deleteExpense(index) {
            savedExpenses.splice(index, 1);
            localStorage.setItem('osaka_expenses', JSON.stringify(savedExpenses));
            renderContent();
        }

        function openBudgetModal() {
            document.getElementById('budget-modal').classList.remove('hidden');
        }

        function closeBudgetModal() {
            document.getElementById('budget-modal').classList.add('hidden');
        }

        // 初始化
        renderTabs();
        renderContent();
    </script>
</body>
</html>
