                                    <option value="all" ${expenseListDate === 'all' ? 'selected' : ''}>全部日期</option>
                                    ${Array.from({length:6},(_,i)=>{const date='2026-10-'+String(i+26);return `<option value="${date}" ${expenseListDate===date?'selected':''}>D${i+1}｜10/${i+26}</option>`;}).join('')}
                                    <option value="undated" ${expenseListDate === 'undated' ? 'selected' : ''}>未設定日期（舊紀錄）</option>
                                </select>
                            </div>
                `;

                const filteredExpenses = savedExpenses.map((exp, idx) => ({exp, idx})).filter(({exp}) => expenseListDate === 'all' || (expenseListDate === 'undated' ? !exp.date : exp.date === expenseListDate));
                const dayJPY = filteredExpenses.reduce((sum, {exp}) => sum + (exp.currency === 'JPY' ? (parseFloat(exp.amount) || 0) : 0), 0);
                const dayTWD = filteredExpenses.reduce((sum, {exp}) => sum + (exp.currency === 'TWD' ? (parseFloat(exp.amount) || 0) : 0), 0);
                html += `<div class="grid grid-cols-2 gap-2">
                    <div class="bg-rose-50 rounded-xl p-3 border border-rose-100"><div class="text-xs font-bold text-rose-600">${expenseListDate === 'all' ? '全部' : '所選日期'}日幣花費</div><div class="text-lg font-black text-rose-700 mt-1">¥ ${dayJPY.toLocaleString()}</div></div>
                    <div class="bg-amber-50 rounded-xl p-3 border border-amber-100"><div class="text-xs font-bold text-amber-700">${expenseListDate === 'all' ? '全部' : '所選日期'}台幣花費</div><div class="text-lg font-black text-amber-800 mt-1">NT$ ${dayTWD.toLocaleString()}</div></div>
                </div>`;

                if (filteredExpenses.length === 0) {
                    html += `<p class="text-xs text-slate-400 text-center py-4">目前還沒有記帳紀錄喔！</p>`;
                } else {
                    filteredExpenses.forEach(({exp, idx}) => {
                        html += `
                            <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs">
                                <div>
                                    <span class="font-bold text-slate-800">${exp.item}</span>
                                    <span class="text-[10px] text-slate-400 ml-1">(${exp.payer})</span>
                                    <span class="text-[11px] text-slate-500 ml-1">${exp.date ? '📅 '+exp.date.slice(5).replace('-', '/') : ''}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-rose-600">${exp.currency === 'JPY' ? '￥' : 'NT$'} ${parseFloat(exp.amount).toLocaleString()}</span>
                                    <button onclick="deleteExpense(${idx})" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `</div></section>`;
                main.innerHTML = html;
                updateNavButtons();
                return;
            }

            // 渲染每日行程頁面
            const day = itineraryData[currentTab];
            let html = `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-4 animate-fade-in">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-lg font-bold">${day.badge}</span>
                        <span class="text-xs text-slate-400 font-medium">${day.date}</span>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900 mb-3">${day.title}</h2>
            `;

            if (day.tips && day.tips.length > 0) {
                html += `<div class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-xl mb-4 text-sm text-amber-900 space-y-1.5">
                    <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation text-amber-500"></i>重要提示與快速購票</div>`;
                day.tips.forEach(tip => {
                    html += `<div>• ${tip}</div>`;
                });
                html += `</div>`;
            }

            html += `<div class="space-y-4 relative before:absolute before:left-3.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-100">`;

            day.items.forEach(item => {
                let badgeBg = 'bg-rose-50 border-rose-100';
                if(item.type === 'food') badgeBg = 'bg-amber-50 border-amber-100';
                if(item.type === 'transport') badgeBg = 'bg-blue-50 border-blue-100';
                if(item.type === 'shopping') badgeBg = 'bg-purple-50 border-purple-100';

                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery || item.title)}`;

                html += `
                    <div class="flex items-start gap-3 relative pl-0.5">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm shrink-0 z-10 shadow-xs border ${badgeBg}">
                            ${item.icon || '📍'}
                        </div>
                        <div class="bg-slate-50/80 hover:bg-slate-50 border border-slate-100 rounded-xl p-3.5 flex-1 transition">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-bold text-slate-500 bg-white px-2 py-0.5 rounded shadow-2xs">${item.time}</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-800 mb-1">
                                <a href="${mapUrl}" target="_blank" class="hover:text-rose-600 transition underline decoration-rose-300 flex items-center gap-1.5">
                                    <span>${item.title}</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-rose-500"></i>
                                </a>
                            </h3>
                            <p class="text-sm text-slate-600 leading-relaxed">${item.desc}</p>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            main.innerHTML = html;
            updateNavButtons();
        }

        function updateNavButtons() {
            // 更新底部導覽列狀態 (D1 ~ D6)
            document.querySelectorAll('.nav-btn-bottom').forEach((btn) => {
                const idx = parseInt(btn.getAttribute('data-index'));
                if (typeof currentTab === 'number' && idx === currentTab) {
                    btn.classList.add('text-rose-600');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('text-rose-600');
                    btn.classList.add('text-slate-500');
                }
            });
        }

        function switchTab(index) {
            currentTab = index;
            renderTabs();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 筆記儲存
        function saveNotes() {
            const val = document.getElementById('notes-input').value;
            savedNotes = val;
            localStorage.setItem('osaka_notes', val);
        }

        // 計算機按鍵與安全的四則運算（不使用 eval）
        function sanitizeExpenseAmount(input) { input.value = input.value.replace(/[^0-9.+\-×÷−]/g, ''); }
        function calculateExpenseExpression(value) {
            const expression = value.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
            if (!/^[0-9.+*/\-\s]+$/.test(expression)) return null;
            const tokens = expression.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+*/-]/g);
            if (!tokens || tokens.join('') !== expression.replace(/\s/g, '')) return null;
            let i = 0;
            function factor() { let sign=1; while(tokens[i]==='+'||tokens[i]==='-') { if(tokens[i]==='-') sign*=-1; i++; } const n=Number(tokens[i++]); if(!Number.isFinite(n)) throw Error('invalid'); return sign*n; }
            function term() { let v=factor(); while(tokens[i]==='*'||tokens[i]==='/') {const op=tokens[i++], rhs=factor(); v=op==='*'?v*rhs:v/rhs;} return v; }
            function sum() {let v=term(); while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],rhs=term();v=op==='+'?v+rhs:v-rhs;}return v;}
            try {const result=sum(); return i===tokens.length && Number.isFinite(result) && result>=0 ? Math.round(result*100)/100 : null;} catch(e){return null;}
        }
        function expenseKey(key) {
            const input=document.getElementById('exp-amount'); if(!input)return;
            if(key==='C') input.value='';
            else if(key==='DEL') input.value=input.value.slice(0,-1);
            else if(key==='=') {const result=calculateExpenseExpression(input.value);if(result===null){alert('請確認計算式與金額');return;}input.value=String(result);}
            else input.value+=key;
        }

        // 新增記帳
        function addExpense() {
            const payer = document.getElementById('exp-payer').value;
            const currency = document.getElementById('exp-currency').value;
            const item = document.getElementById('exp-item').value;
            const date = document.getElementById('exp-date').value;
            const rawAmount = document.getElementById('exp-amount').value;
            const calculatedAmount = calculateExpenseExpression(rawAmount);
            const amount = calculatedAmount === null ? '' : String(calculatedAmount);

            if (!item || !amount) {
                alert('請輸入消費項目與金額喔！');
                return;
            }

            savedExpenses.push({ payer, currency, item, amount, date });
            localStorage.setItem('osaka_expenses', JSON.stringify(savedExpenses));
            renderContent();
        }

        // 消費明細日期篩選
        function changeExpenseListDate(value) {
            expenseListDate = value;
            renderContent();
        }

        // 刪除記帳
        function deleteExpense(index) {
            savedExpenses.splice(index, 1);
            localStorage.setItem('osaka_expenses', JSON.stringify(savedExpenses));
            renderContent();
        }

        // 初始化
        renderTabs();
        renderContent();
    </script>
</body>
</html>
